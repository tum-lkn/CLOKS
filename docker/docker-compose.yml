version: "3.9"

services:
  influxdb:
    image: influxdb:3.7-core
    container_name: influxdb
    ports:
      - "8181:8181"
    command: ["influxdb3", "serve", "--node-id=my-node-0"]
    volumes:
      - ../conf/exporter/influx-admin.token:/admin.token
      - ./init-token.sh:/init-token.sh:ro
    restart: unless-stopped
    entrypoint: ["/init-token.sh"]

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - influxdb

volumes:
  grafana-storage: