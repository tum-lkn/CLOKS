num_nodes: 3

# Option 2: Per-node configuration (allows different CPU counts per node) 
node_configs:
  - name: "RPi"            # Small Raspberry Pi node
    node_ids: [0, 1]          # Node 0 uses this configuration
    template: "rpi4"       # Use rpi4 template
  - name: "Server"         # Standard server node
    node_ids: [2]          # Node 1 uses this configuration
    template: "c5.2xlarge"   # Use AWS m5.large template

cpu:
  # scheduling_algorithm: "cfs"
  scheduling_algorithm: "rr"
  # cfs_quota_us: 200000
  # cfs_period_us: 1000000

# Inter-node latency matrix (in milliseconds)
# Matrix must be symmetric and all values must be positive
# Row i, Column j represents latency from node i to node j
inter_node_latency:
  - [0.1, 1.5, 2.0]  # Node 0 to: [Node 0, Node 1, Node 2]
  - [1.5, 0.1, 1.8]  # Node 1 to: [Node 0, Node 1, Node 2]
  - [2.0, 1.8, 0.1]  # Node 2 to: [Node 0, Node 1, Node 2]