num_nodes: 4
# High-performance node configuration with 1,000 CPUs for scalability testing

# Per-node configuration with VM templates
node_configs:
  - name: "High-Performance Server"  # Large server node for scalability testing
    node_ids: [0,1,2,3]                     # Node 0 uses this configuration
    template: "custom_1000cpu"        # Use custom 1000 CPU template

cpu:
  # scheduling_algorithm: "cfs"
  scheduling_algorithm: "rr"
  # cfs_quota_us: 200000
  # cfs_period_us: 1000000

# Inter-node latency matrix (in milliseconds)
# Matrix must be symmetric and all values must be positive
# Row i, Column j represents latency from node i to node j

# Inter-node latency matrix (in milliseconds)
# Matrix must be symmetric and all values must be positive
# Row i, Column j represents latency from node i to node j
inter_node_latency:
  - [0.05, 0.25, 0.25, 0.25]  # Node 0 to: [Node 0, Node 1, Node 2, Node 3]
  - [0.25, 0.05, 0.25, 0.25]  # Node 1 to: [Node 0, Node 1, Node 2, Node 3]
  - [0.25, 0.25, 0.05, 0.25]  # Node 2 to: [Node 0, Node 1, Node 2, Node 3]
  - [0.25, 0.25, 0.25, 0.05]  # Node 3 to: [Node 0, Node 1, Node 2, Node 3]